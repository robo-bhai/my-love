name: Run Daraz Scraper Web UI (4 Hours via Cloudflare)

on:
  workflow_dispatch:

jobs:
  run-web-app:
    runs-on: ubuntu-latest
    timeout-minutes: 250  # 4 ghante (240 mins) + buffer

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai flask

      - name: Download & Install Cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflare-tunnel-remote/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Flask App & Cloudflare Tunnel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # 1. Background mein Flask App start karein (Port 5000)
          python app.py &
          sleep 3

          # 2. Cloudflare Tunnel start karein aur link log file mein save karein
          cloudflared tunnel --url http://localhost:5000 > cloudflare.log 2>&1 &
          
          echo "Tunnel setup ho raha hai, link ka wait karein..."
          sleep 8

          # 3. Log file se public trycloudflare URL extract karke print karein
          echo -e "\n=================================================="
          grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflare.log | head -n 1 | awk '{print "🚀 AAPKA LIVE WEB APP READY HAI!\n👉 Public Link: " $1}'
          echo -e "==================================================\n"

          # 4. Runner ko 4 ghante (14,400 seconds) tak active rakhein
          sleep 14400

